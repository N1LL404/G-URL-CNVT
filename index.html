<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>AdXtreme</title>

<style>
:root {
    --bg: #050506;
    --panel: rgba(10, 10, 12, 0.94);
    --panel-2: #080809;
    --border: rgba(255, 255, 255, 0.10);
    --border-strong: #29292d;

    --text: #f5f5f7;
    --muted: #77777f;
    --muted-2: #4c4c52;

    --red: #e20e35;
    --red-bright: #ff2349;
    --red-dark: #8c0019;

    --radius: 12px;
}



* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
    background: var(--bg);
}

body {
    min-height: 100vh;
    min-height: 100dvh;

    color: var(--text);
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 80% 15%,
            rgba(255, 255, 255, 0.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 10% 50%,
            rgba(190, 0, 35, 0.14),
            transparent 38%
        ),
        linear-gradient(
            145deg,
            #08080a,
            #020203 60%,
            #08080a
        );

    display: flex;
    justify-content: center;
    align-items: center;

    padding:
        max(24px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));

    position: relative;
    overflow-x: hidden;
}



body::before {
    content: "";

    position: fixed;

    top: 21%;
    left: -15%;

    width: 85vw;
    max-width: 1100px;
    height: 2px;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 0, 45, 0.35),
        #ff173f,
        rgba(255, 0, 45, 0.25),
        transparent
    );

    box-shadow:
        0 0 8px rgba(255, 15, 55, 0.8),
        0 0 28px rgba(255, 0, 45, 0.45),
        0 0 60px rgba(255, 0, 45, 0.18);

    transform: rotate(-1deg);

    pointer-events: none;
    z-index: 0;
}


body::after {
    content: "";

    position: fixed;

    width: 650px;
    height: 650px;

    top: -300px;
    right: -260px;

    background:
        radial-gradient(
            circle,
            rgba(255, 0, 45, 0.20),
            transparent 68%
        );

    filter: blur(25px);

    pointer-events: none;
    z-index: 0;
}


.checker {
    position: fixed;

    width: min(850px, 90vw);
    height: 550px;

    bottom: -230px;
    left: -150px;

    opacity: 0.09;

    transform:
        rotate(-14deg)
        perspective(700px)
        rotateX(58deg);

    background-size: 70px 70px;

    background-image:
        linear-gradient(
            45deg,
            rgba(255,255,255,.7) 25%,
            transparent 25%
        ),
        linear-gradient(
            -45deg,
            rgba(255,255,255,.7) 25%,
            transparent 25%
        ),
        linear-gradient(
            45deg,
            transparent 75%,
            rgba(255,255,255,.7) 75%
        ),
        linear-gradient(
            -45deg,
            transparent 75%,
            rgba(255,255,255,.7) 75%
        );

    filter: blur(1px);

    pointer-events: none;
    z-index: 0;
}



.page {
    width: 100%;
    max-width: 780px;

    position: relative;
    z-index: 2;
}



.converter {
    width: 100%;

    padding: clamp(24px, 5vw, 46px);

    background:
        linear-gradient(
            145deg,
            rgba(18, 18, 21, 0.96),
            rgba(4, 4, 6, 0.96)
        );

    border: 1px solid var(--border);

    border-radius: var(--radius);

    box-shadow:
        0 35px 100px rgba(0, 0, 0, 0.78),
        0 0 65px rgba(255, 0, 45, 0.05);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    position: relative;
    overflow: hidden;
}


.converter::before {
    content: "";

    position: absolute;

    top: 0;
    left: 8%;

    width: 84%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red-bright),
            transparent
        );

    box-shadow:
        0 0 18px rgba(255, 20, 65, 0.75);
}



.system-label {
    display: flex;
    align-items: center;
    gap: 9px;

    margin-bottom: 16px;

    color: var(--red-bright);

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 4px;
    text-transform: uppercase;
}

.system-label::before {
    content: "";

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--red-bright);

    box-shadow:
        0 0 10px var(--red-bright),
        0 0 20px rgba(255, 30, 70, 0.5);

    flex-shrink: 0;
}



.brand {
    font-size: clamp(40px, 8vw, 68px);

    font-weight: 900;

    letter-spacing: -3px;

    line-height: 0.95;

    margin-bottom: 17px;

    color: #f4f4f6;

    user-select: none;

    text-shadow:
        0 4px 20px rgba(0, 0, 0, 0.6);
}

.brand .x {
    color: var(--red-bright);

    text-shadow:
        0 0 12px rgba(255, 25, 65, 0.50),
        0 0 30px rgba(255, 0, 45, 0.18);
}


.subtitle {
    max-width: 580px;

    color: var(--muted);

    font-size: clamp(13px, 2vw, 15px);

    line-height: 1.65;

    margin-bottom: clamp(25px, 5vw, 36px);
}



.field-label {
    display: block;

    color: #929298;

    font-size: 10px;

    font-weight: 700;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    margin-bottom: 10px;
}


.input-wrap {
    width: 100%;
    position: relative;
}

input {
    display: block;

    width: 100%;
    min-width: 0;

    height: 58px;

    padding: 0 18px;

    color: #eeeeef;

    background:
        linear-gradient(
            180deg,
            #09090b,
            #060607
        );

    border: 1px solid var(--border-strong);

    border-radius: 7px;

    outline: none;

    font-size: 15px;

    font-family:
        Consolas,
        "SFMono-Regular",
        monospace;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input::placeholder {
    color: #444449;
}

input:focus {
    border-color: rgba(255, 25, 65, 0.75);

    background: #080809;

    box-shadow:
        0 0 0 1px rgba(255, 30, 70, 0.15),
        0 0 25px rgba(255, 0, 45, 0.08);
}


.convert-btn {
    width: 100%;
    height: 56px;

    margin-top: 14px;

    border: 0;
    border-radius: 7px;

    color: #fff;

    background:
        linear-gradient(
            110deg,
            #820017,
            #d60b32 45%,
            #9b001d
        );

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08),
        0 8px 24px rgba(180,0,35,.12);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 2.5px;

    text-transform: uppercase;

    cursor: pointer;

    position: relative;
    overflow: hidden;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        filter .2s ease;
}

.convert-btn:hover {
    transform: translateY(-2px);

    filter: brightness(1.08);

    box-shadow:
        0 12px 35px rgba(220, 0, 45, 0.24),
        0 0 25px rgba(255, 0, 45, 0.08);
}

.convert-btn:active {
    transform: translateY(0) scale(.995);
}


.convert-btn::before {
    content: "";

    position: absolute;

    top: -40%;
    left: -35%;

    width: 18%;
    height: 190%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.23),
            transparent
        );

    transform: rotate(18deg);

    transition: left .65s ease;
}

.convert-btn:hover::before {
    left: 120%;
}
#error {
    min-height: 20px;

    margin-top: 10px;

    color: #ff3659;

    font-size: 13px;

    line-height: 1.45;
}

#resultBox {
    display: none;

    margin-top: 16px;

    padding: clamp(16px, 4vw, 21px);

    background:
        linear-gradient(
            145deg,
            rgba(5,5,6,.9),
            rgba(10,10,12,.95)
        );

    border: 1px solid #232328;
    border-left: 2px solid var(--red);

    border-radius: 7px;

    animation: reveal .25s ease;
}


@keyframes reveal {
    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


.result-title {
    color: #727278;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 3px;

    text-transform: uppercase;

    margin-bottom: 11px;
}


#result {
    width: 100%;

    padding: 14px;

    color: #f5f5f5;

    background: #050506;

    border: 1px solid #1e1e22;

    border-radius: 5px;

    font-family:
        Consolas,
        "SFMono-Regular",
        monospace;

    font-size: 13px;

    line-height: 1.6;

    overflow-wrap: anywhere;
    word-break: break-word;
}


.copy-btn {
    width: 100%;
    min-height: 48px;

    margin-top: 11px;

    border: 1px solid #34343a;
    border-radius: 6px;

    color: #aaaaaf;

    background: rgba(255,255,255,.015);

    font-size: 11px;

    font-weight: 800;

    letter-spacing: 2px;

    cursor: pointer;

    transition:
        color .2s ease,
        border-color .2s ease,
        background .2s ease;
}

.copy-btn:hover {
    color: white;

    border-color: rgba(255, 25, 65, 0.8);

    background: rgba(220, 0, 40, 0.06);
}

.footer {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    margin-top: 25px;

    color: #3e3e43;

    font-size: 9px;

    font-weight: 700;

    letter-spacing: 2.5px;

    text-transform: uppercase;
}

.footer span {
    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: #6f071a;
}


@media (max-width: 768px) {

    body {
        align-items: center;
        padding: 22px 16px;
    }

    .converter {
        border-radius: 10px;
    }

    .brand {
        letter-spacing: -2px;
    }

    .checker {
        width: 700px;
        bottom: -260px;
        left: -260px;
    }
}


@media (max-width: 520px) {

    body {
        align-items: flex-start;

        padding:
            max(22px, env(safe-area-inset-top))
            14px
            max(22px, env(safe-area-inset-bottom));
    }

    .page {
        margin: auto 0;
    }

    .converter {
        padding: 27px 18px 22px;
        border-radius: 9px;
    }

    .system-label {
        font-size: 8px;
        letter-spacing: 2.5px;
        margin-bottom: 13px;
    }

    .brand {
        font-size: clamp(39px, 14vw, 56px);
        letter-spacing: -2.5px;
        margin-bottom: 14px;
    }

    .subtitle {
        font-size: 12.5px;
        margin-bottom: 24px;
    }

    .field-label {
        font-size: 8px;
        letter-spacing: 2px;
    }

    input {
        height: 55px;

        padding: 0 14px;

        font-size: 13px;
    }

    .convert-btn {
        height: 53px;

        font-size: 11px;

        letter-spacing: 2px;
    }

    #result {
        font-size: 11.5px;
        padding: 12px;
    }

    .footer {
        font-size: 7px;
        letter-spacing: 1.7px;
    }

    body::before {
        top: 18%;
        width: 120vw;
    }
}


/* =========================
   VERY SMALL PHONES
========================= */

@media (max-width: 360px) {

    body {
        padding-left: 10px;
        padding-right: 10px;
    }

    .converter {
        padding-left: 15px;
        padding-right: 15px;
    }

    .brand {
        font-size: 39px;
    }

    input {
        font-size: 12px;
    }
}
@media (min-width: 1200px) {

    .page {
        max-width: 820px;
    }

    .converter {
        padding: 50px;
    }
}

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        transition: none !important;
        animation: none !important;
    }
}
</style>
</head>


<body>

<div class="checker"></div>


<main class="page">

    <section class="converter">

        <div class="system-label">
            Link Conversion System
        </div>


        <!-- BRAND -->
        <div class="brand">
            Ad<span class="x">X</span>treme
        </div>


        <p class="subtitle">
            Convert your Google Share link into the
            Google share handler format instantly.
        </p>


        <label
            for="shareUrl"
            class="field-label"
        >
            Google Share URL
        </label>


        <div class="input-wrap">

            <input
                id="shareUrl"
                type="url"
                inputmode="url"
                autocapitalize="none"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
                placeholder="https://share.google/gJ2EEmIZerLLUPo5X"
            >

        </div>


        <button
            id="convertButton"
            class="convert-btn"
            type="button"
        >
            Convert URL
        </button>


        <div
            id="error"
            role="alert"
            aria-live="polite"
        ></div>


        <div id="resultBox">

            <div class="result-title">
                Converted URL
            </div>

            <div id="result"></div>


            <button
                id="copyButton"
                class="copy-btn"
                type="button"
            >
                COPY URL
            </button>

        </div>


        <footer class="footer">
            SHARE
            <span></span>
            CONVERT
            <span></span>
            COPY
        </footer>

    </section>

</main>


<script>
const input =
    document.getElementById("shareUrl");

const convertButton =
    document.getElementById("convertButton");

const copyButton =
    document.getElementById("copyButton");

const resultBox =
    document.getElementById("resultBox");

const result =
    document.getElementById("result");

const error =
    document.getElementById("error");

function convertUrl() {

    let value = input.value.trim();

    error.textContent = "";
    resultBox.style.display = "none";


    if (!value) {

        error.textContent =
            "Please paste a share.google URL.";

        input.focus();

        return;
    }


    try {

        if (
            !value.startsWith("https://") &&
            !value.startsWith("http://")
        ) {

            value = "https://" + value;
        }


        const parsed =
            new URL(value);


        const hostname =
            parsed.hostname.toLowerCase();


        if (
            hostname !== "share.google" &&
            hostname !== "www.share.google"
        ) {

            error.textContent =
                "Please enter a valid share.google URL.";

            return;
        }


        const token =
            parsed.pathname
                .replace(/^\/+|\/+$/g, "")
                .split("/")[0];


        if (!token) {

            error.textContent =
                "Google share token was not found.";

            return;
        }


        const converted =
            "https://www.google.com/share.google?q=" +
            encodeURIComponent(token);


        result.textContent =
            converted;


        resultBox.style.display =
            "block";

    }

    catch (err) {

        error.textContent =
            "The URL you entered is invalid.";
    }
}


async function copyResult() {

    const url =
        result.textContent.trim();


    if (!url) return;


    try {

        await navigator.clipboard.writeText(url);


        copyButton.textContent =
            "✓ COPIED";


        setTimeout(() => {

            copyButton.textContent =
                "COPY URL";

        }, 1400);

    }

    catch (err) {

        const textarea =
            document.createElement("textarea");

        textarea.value = url;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();


        copyButton.textContent =
            "✓ COPIED";


        setTimeout(() => {

            copyButton.textContent =
                "COPY URL";

        }, 1400);
    }
}

convertButton.addEventListener(
    "click",
    convertUrl
);


copyButton.addEventListener(
    "click",
    copyResult
);


input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            convertUrl();
        }
    }
);
</script>

</body>
</html>
